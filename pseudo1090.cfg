# ═══════════════════════════════════════════════════════════════════════════
#  Custom 1090 MHz message format
# ═══════════════════════════════════════════════════════════════════════════
#
#  This file defines a message format that REPLACES standard ADS-B while
#  reusing the same physical layer, so no new hardware is required: same
#  1090 MHz transceivers, same 112-bit Mode S frame, same CRC-24.  Only the
#  payload content is different.
#
#      frame = [ 88 payload bits, defined below ][ 24-bit CRC ]
#                bit 0 ....................... bit 87
#
#  Validate this file without launching the simulator:
#
#      python pseudo1090.py --check          # layout, bit map, resolutions
#      python pseudo1090.py --demo           # encode and decode a sample
#
#  Both report every problem at once, naming the section and field.
#
# ── Field syntax ───────────────────────────────────────────────────────────
#
#      <name> = <offset> <width> <encoding> <source> [role=...]
#
#  offset    first bit, 0-87, counted from the MSB of the payload
#  width     number of bits
#
#  encoding
#      uint[:step]    unsigned.  step is the value of one count (default 1),
#                     so 'uint:25' in 11 bits covers 0-51175 ft in 25 ft steps
#      int[:step]     signed, two's complement
#      scaled:range   signed fraction of ±range across the field, giving
#                     resolution range / (2^(width-1) - 1).  Best for lat/lon
#      octal          unsigned, displayed as octal.  For squawks and Mode codes
#      ascii6         text in the 6-bit alphabet.  width must be a multiple of 6
#      flag           single bit, 1 bit wide
#      const:<n>      a fixed value; needs no source
#
#  source    ac.lat  ac.lon  ac.alt_ft  ac.speed_kt  ac.track  ac.heading
#            ac.vrate_fpm  ac.callsign  ac.modes_addr
#            ac.mode1  ac.mode2  ac.mode3a  ac.spi
#
# ═══════════════════════════════════════════════════════════════════════════

[format]

# Which format the aircraft transmit on 1090 MHz.
#
#   standard  DO-260B ADS-B only — the original behaviour
#   custom    this format only, replacing ADS-B entirely
#   both      both formats, for comparing them side by side on one screen
#
# This ships as `standard` so that dropping the file in changes nothing until
# you ask it to.  Set it to `custom` for the replace-ADS-B scenario, or switch
# live with the `transmit` control in the 1090 FORMAT panel — the dropdown
# overrides this setting for the running session.
mode = standard

# ── The two shared fields ──────────────────────────────────────────────────
#
# Because this format owns all 88 bits, there is no standard header for a
# receiver to lean on, so two things have to be declared explicitly.  Both
# are written into EVERY message and are off-limits to per-message fields.
#
# type_field     which message type this is.  Mandatory once more than one
#                [msg:...] exists, because otherwise nothing on the wire
#                distinguishes them.  4 bits allows 16 message types.
#
# address_field  the 24-bit aircraft address.  Putting it in every message is
#                what lets any single frame be tied to a track — the same
#                reason real ADS-B carries the ICAO address in all of them.
#                It costs 24 of 88 bits, i.e. 27% overhead, in every frame.
#                The alternative is to carry it in one message type only
#                (see 'role=address') and accept that other message types
#                decode but cannot be attributed to an aircraft.

type_field    = 0 4
address_field = 4 24

# That leaves bits 28-87 — 60 bits — for each message's own fields.


# ── Position report ────────────────────────────────────────────────────────
#  Deliberately simpler than ADS-B: a plain signed lat/lon instead of CPR, so
#  one frame is a complete position.  No even/odd pairing, no ambiguity, no
#  acquisition delay.  That is the trade — CPR buys range with fewer bits at
#  the cost of needing two frames; here we spend bits instead and get an
#  instant fix.
#
#  bits 28-51  lat  24 bits over ±90   -> 1.07e-5 deg, about 1.2 m
#  bits 52-76  lon  25 bits over ±180  -> 1.07e-5 deg, about 1.2 m
#  bits 77-87  alt  11 bits, 25 ft     -> 0 to 51175 ft
#              (60 of 60 bits used)

[msg:position]
id     = 1
period = 0.5
jitter = 0.1

lat    = 28 24 scaled:90   ac.lat
lon    = 52 25 scaled:180  ac.lon
alt_ft = 77 11 uint:25     ac.alt_ft


# ── Identity report ───────────────────────────────────────────────────────
#  bits 28-75  callsign  48 bits, 8 chars x 6
#  bits 76-87  squawk    12 bits, octal
#              (60 of 60 bits used)

#  Note the interaction with field ageing: the display dashes a field out
#  once it is older than 4 s, so a 5 s ident period leaves the callsign and
#  squawk blank for about a second in every five.  Shorten the period to 3.0
#  if you would rather they stayed on screen continuously.

[msg:ident]
id     = 2
period = 5.0
jitter = 0.2

callsign = 28 48 ascii6  ac.callsign
squawk   = 76 12 octal   ac.mode3a


# ── Velocity report ───────────────────────────────────────────────────────
#  bits 28-38  ground speed   11 bits, 2 kt   -> 0 to 4094 kt
#  bits 39-49  vertical rate  11 bits, 32 fpm, signed
#  bits 50-58  track           9 bits, 1 deg
#  bit     59  SPI / ident
#              (32 of 60 bits used — 28 spare for you to extend)

[msg:velocity]
id     = 3
period = 0.5
jitter = 0.1

speed_kt  = 28 11 uint:2  ac.speed_kt
vrate_fpm = 39 11 int:32  ac.vrate_fpm
track_deg = 50  9 uint:1  ac.track
spi       = 59  1 flag    ac.spi
