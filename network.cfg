# ADS-B multicast network settings
# All four tools read this file as their default values.
# CLI flags (--group, --port, --iface) always override these.

group = 239.255.0.1
port  = 30003
iface = 127.0.0.1

# ASTERIX CAT021 + radar-position output (path_emulator, unicast UDP).
# CLI flags (--asterix-host, --asterix-port) always override these.
asterix_host = 127.0.0.1
asterix_port = 8600

# IFF interrogation input (external control message, read by iff_radar.py).
# transport = multicast (join the group) or unicast (bind on iface).
iff_interrogation_host      = 239.100.100.1
iff_interrogation_port      = 4001
iff_interrogation_transport = multicast
iff_interrogation_iface     = 127.0.0.1

# IFF reply output.
iff_reply_host      = 239.100.100.2
iff_reply_port      = 4002
iff_reply_transport = multicast
iff_reply_iface     = 127.0.0.1

# Radar → Aircraft channel (interrogation packet).
ac_channel_int_host      = 127.0.0.1
ac_channel_int_port      = 5001
ac_channel_int_transport = unicast
ac_channel_int_iface     = 127.0.0.1

# Aircraft → Radar channel (per-target reply packet).
ac_channel_rep_host      = 127.0.0.1
ac_channel_rep_port      = 5002
ac_channel_rep_transport = unicast
ac_channel_rep_iface     = 127.0.0.1
